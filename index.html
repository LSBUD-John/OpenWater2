<!DOCTYPE html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>LSBUD OpenWater - Phase 7 UX</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'>
<style>
body{margin:0;font-family:Arial}#map{position:fixed;inset:0}#panel{position:absolute;right:15px;top:15px;width:430px;background:#fff;padding:15px;border-radius:12px;z-index:1000;max-height:92vh;overflow:auto;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.lsb,.d{color:#08243a;font-weight:700;font-size:38px}.u{color:#d92d27;font-weight:700;font-size:38px}.ow{color:#666;font-size:38px}.tag{font-size:12px;font-weight:700;color:#08243a}.strap{font-size:13px;color:#555;margin:6px 0 12px;padding-bottom:10px;border-bottom:2px solid #08243a}
input,button{width:100%;padding:10px;margin:5px 0;box-sizing:border-box;border:none;border-radius:10px;font-weight:700}
.btn-primary{background:#08243a;color:#fff}.btn-secondary{background:#6b7280;color:#fff}.btn-danger{background:#a92f38;color:#fff}.btn-active{box-shadow:0 0 0 3px rgba(70,140,220,.35);background:#10304a!important}
#modeStatus{font-size:13px;font-weight:700;color:#08243a;padding:10px 0;border-bottom:1px solid #ddd;margin-bottom:10px}.feature{padding:6px 0;border-top:1px solid #eee}
</style></head><body>
<div id='panel'>
<div><span class='lsb'>LSB</span><span class='u'>U</span><span class='d'>D</span><span class='ow'> OpenWater</span></div>
<div class='tag'>OPEN WATER RISK & PLANNING HUB</div>
<div class='strap'>Advanced water feature analysis that identifies nearby open water hazards and supports safer site planning.</div>
<input id='searchBox' placeholder='Search address'>
<button id='findBtn' class='btn-primary'>Find</button>
<button id='drawBtn' class='btn-primary'>Draw Polygon</button>
<button id='finishBtn' class='btn-secondary'>Finish Drawing</button>
<button id='clearBtn' class='btn-danger'>Clear</button>
<div id='modeStatus'>No drawing mode selected</div>
<p>Area: <span id='area'>0.000</span> km²</p><p>Price: £<span id='price'>0.00</span></p>
<p><b>Nearest Feature:</b> <span id='nearest'>-</span></p><p><b>Distance:</b> <span id='dist'>-</span></p><p><b>Risk:</b> <span id='risk'>Unknown</span></p>
<button id='analyseBtn' class='btn-primary'>Analyse Open Water</button>
<div id='features'></div></div>
<div id='map'></div>
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<script>
const map=L.map('map').setView([52.48,-1.89],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let drawing=false,pts=[],poly=null,water=L.featureGroup().addTo(map);
drawBtn.onclick=()=>{drawing=true;pts=[];drawBtn.classList.add('btn-active');modeStatus.innerText='Polygon mode active - click points on the map.';};
map.on('click',e=>{if(!drawing)return;pts.push(e.latlng);if(poly)map.removeLayer(poly);poly=L.polygon(pts,{color:'red'}).addTo(map);});
finishBtn.onclick=()=>{if(pts.length<3){alert('Add at least three points');return;}drawing=false;drawBtn.classList.remove('btn-active');modeStatus.innerText='Polygon completed.';};
clearBtn.onclick=()=>{drawing=false;pts=[];if(poly){map.removeLayer(poly);poly=null;}water.clearLayers();area.textContent='0.000';price.textContent='0.00';nearest.textContent='-';dist.textContent='-';risk.textContent='Unknown';features.innerHTML='';drawBtn.classList.remove('btn-active');modeStatus.innerText='No drawing mode selected';};
</script></body></html>
