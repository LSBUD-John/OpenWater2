<!DOCTYPE html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>LSBUD OpenWater Phase 8.2</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'>
<style>
body{margin:0;font-family:Arial}#map{position:fixed;inset:0}#panel{position:absolute;right:15px;top:15px;width:440px;background:#fff;padding:15px;border-radius:12px;max-height:92vh;overflow:auto;z-index:1000}.lsb,.d{color:#08243a;font-weight:700;font-size:38px}.u{color:#d92d27;font-weight:700;font-size:38px}.ow{color:#666;font-size:38px}.btn-primary{background:#08243a;color:#fff;border:none}.btn-secondary{background:#6b7280;color:#fff;border:none}.btn-danger{background:#a92f38;color:#fff;border:none}button,input{width:100%;padding:10px;margin:5px 0;box-sizing:border-box}.feature{border-top:1px solid #ddd;padding:6px 0}
</style></head><body>
<div id='panel'>
<div><span class='lsb'>LSB</span><span class='u'>U</span><span class='d'>D</span><span class='ow'> OpenWater</span></div>
<p><b>OPEN WATER RISK & PLANNING HUB</b></p>
<input id='searchBox' placeholder='Search address'>
<button id='drawBtn' class='btn-primary'>Draw Polygon</button>
<button id='finishBtn' class='btn-secondary'>Finish Drawing</button>
<button id='clearBtn' class='btn-danger'>Clear</button>
<div id='status'>No drawing mode selected</div>
<p>Area: <span id='area'>0.000</span> km²</p>
<p>Price: £<span id='price'>0.00</span></p>
<p><b>Nearest Feature:</b> <span id='nearest'>-</span></p>
<p><b>Distance:</b> <span id='dist'>-</span></p>
<p><b>Risk:</b> <span id='risk'>Unknown</span></p>
<button id='analyseBtn' class='btn-primary'>Analyse Open Water</button>
<div id='features'></div>
</div><div id='map'></div>
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script src='https://unpkg.com/@turf/turf@6/turf.min.js'></script>
<script>
const map=L.map('map').setView([52.48,-1.89],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let drawing=false,pts=[],poly=null,siteGeo=null;
const INCLUDE=['canal','river','stream','brook','rill','basin','lake','reservoir','pond','pool','dock','marina','loch','lough','mere','water','tarn','broad','lagoon','estuary','bay','gulf','firth','sound','sea','ocean','marsh','bog','saltmarsh','swamp','fen','leat','fleam','aqueduct'];
const EXCLUDE=['wharf','bar','bridge','tunnel','towpath','quay','road','building'];
map.on('click',e=>{if(!drawing)return;pts.push(e.latlng);if(poly)map.removeLayer(poly);poly=L.polygon(pts,{color:'red'}).addTo(map)});
drawBtn.onclick=()=>{drawing=true;pts=[];status.innerText='Polygon mode active';};
finishBtn.onclick=()=>{if(pts.length<3)return;drawing=false;const r=pts.map(p=>[p.lng,p.lat]);r.push(r[0]);siteGeo=turf.polygon([r]);const a=turf.area(siteGeo)/1e6;area.textContent=a.toFixed(3);price.textContent=Math.max(4.95,a*2).toFixed(2);status.innerText='Polygon completed';};
clearBtn.onclick=()=>{if(poly)map.removeLayer(poly);poly=null;pts=[];siteGeo=null;features.innerHTML='';nearest.textContent='-';dist.textContent='-';risk.textContent='Unknown';area.textContent='0.000';price.textContent='0.00';};
async function query(q){for(const ep of ['https://overpass-api.de/api/interpreter','https://lz4.overpass-api.de/api/interpreter']){try{const r=await fetch(ep+'?data='+encodeURIComponent(q));if(r.ok)return JSON.parse(await r.text());}catch(e){}}throw Error('No service');}
function classify(tags){const txt=((tags.name||'')+' '+JSON.stringify(tags)).toLowerCase();for(const e of EXCLUDE){if(txt.includes(e)) return null;}if(tags.waterway) return tags.waterway; if(tags.water) return tags.water; if(tags.natural==='water') return 'water'; return null;}
analyseBtn.onclick=async()=>{if(!siteGeo)return alert('Draw site first');features.innerHTML='Searching...';const b=turf.bbox(siteGeo);try{const q=`[out:json][timeout:15];(way(${b[1]-0.001},${b[0]-0.001},${b[3]+0.001},${b[2]+0.001})[waterway];way(${b[1]-0.001},${b[0]-0.001},${b[3]+0.001},${b[2]+0.001})[natural=water];);out tags center;`;const data=await query(q);const c=turf.centroid(siteGeo).geometry.coordinates;let rows=(data.elements||[]).map(e=>{const type=classify(e.tags||{});if(!type||!e.center)return null;return {name:e.tags.name||'Unnamed',type:type,d:Math.round(turf.distance(turf.point(c),turf.point([e.center.lon,e.center.lat]),{units:'kilometers'})*1000)};}).filter(x=>x&&x.d<=500).sort((a,b)=>a.d-b.d);if(rows.length){nearest.textContent=rows[0].name;dist.textContent=rows[0].d+'m';risk.textContent=rows[0].d<=25?'HIGH':rows[0].d<=50?'MEDIUM':rows[0].d<=100?'LOW':'NONE';}features.innerHTML=rows.map(r=>`<div class='feature'><b>${r.name}</b><br>Type: ${r.type}<br>Distance: ${r.d}m</div>`).join('');}catch(e){features.innerHTML='Water service unavailable';}};
</script></body></html>
