<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LSBUD OpenWater 2.2</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
}

#map{
    position:fixed;
    inset:0;
}

#panel{
    position:absolute;
    right:15px;
    top:15px;
    width:460px;
    background:#fff;
    z-index:1000;
    padding:18px;
    border-radius:12px;
    max-height:92vh;
    overflow:auto;
    box-shadow:0 2px 12px rgba(0,0,0,.25);
}

.lsb,.d{
    color:#08243a;
    font-size:34px;
    font-weight:700;
}

.u{
    color:#d92d27;
    font-size:34px;
    font-weight:700;
}

.ow{
    color:#666;
    font-size:34px;
}

button{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:none;
    cursor:pointer;
}

.btn-primary{
    background:#08243a;
    color:white;
}

.btn-secondary{
    background:#6b7280;
    color:white;
}

.btn-danger{
    background:#b22938;
    color:white;
}

#status{
    font-weight:bold;
    margin:12px 0;
}

.metric{
    margin:12px 0;
}

.risk-high{
    color:#c00000;
    font-weight:bold;
}

.risk-medium{
    color:#d97706;
    font-weight:bold;
}

.risk-low{
    color:#15803d;
    font-weight:bold;
}

.risk-none{
    color:#666;
    font-weight:bold;
}

#summary{
    line-height:1.5;
    margin-top:12px;
}

</style>
</head>

<body>

<div id="panel">

<div>
<span class="lsb">LSB</span>
<span class="u">U</span>
<span class="d">D</span>
<span class="ow"> OpenWater</span>
</div>

<p><b>OPEN WATER RISK & PLANNING HUB</b></p>

<button id="drawBtn" class="btn-primary">
Draw Polygon
</button>

<button id="finishBtn" class="btn-secondary">
Finish Drawing
</button>

<button id="clearBtn" class="btn-danger">
Clear
</button>

<div id="status">
Loading dataset...
</div>

<div class="metric">
Area:
<span id="area">0.000</span> km²
</div>

<div id="summary">
Please draw a site polygon and click
<b>Analyse Open Water</b>.
</div>

<button id="analyseBtn" class="btn-primary">
Analyse Open Water
</button>

</div>

<div id="map"></div>

pkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
turf/turf@6/turf.min.js"></script>

<script>

const map =
    L.map('map')
     .setView([52.48,-1.89],13);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution:'© OpenStreetMap contributors'
    }
).addTo(map);

let waterData = null;
let siteGeo = null;
let sitePolygon = null;
let drawing = false;
let points = [];

async function loadWater(){

    try{

        const response =
            await fetch(
                './SurfaceWater_bham_clip.geojson'
            );

        waterData =
            await response.json();

        status.textContent =
            'Surface water dataset loaded';

    }
    catch(error){

        status.textContent =
            'Failed to load SurfaceWater_bham_clip.geojson';

        console.error(error);

    }

}

loadWater();

drawBtn.onclick = () => {

    drawing = true;

    points = [];

    if(sitePolygon){

        map.removeLayer(sitePolygon);

    }

    summary.innerHTML =
        'Polygon drawing mode active.';

};

map.on('click', e => {

    if(!drawing) return;

    points.push(e.latlng);

    if(sitePolygon){

        map.removeLayer(sitePolygon);

    }

    sitePolygon =
        L.polygon(
            points,
            {color:'red'}
        ).addTo(map);

});

finishBtn.onclick = () => {

    if(points.length < 3){

        alert(
            'Please draw at least three points.'
        );

        return;

    }

    drawing = false;

    const ring =
        points.map(
            p => [p.lng,p.lat]
        );

    ring.push(ring[0]);

    siteGeo =
        turf.polygon([ring]);

    area.textContent =
        (
            turf.area(siteGeo)
            /1000000
        ).toFixed(3);

    summary.innerHTML =
        '<b>Assessment Pending</b><br>' +
        'Click Analyse Open Water to perform the assessment.';

};

function countFeatures(distance){

    const polygon =
        distance === 0
            ? siteGeo
            : turf.buffer(
                  siteGeo,
                  distance,
                  {units:'meters'}
              );

    return waterData.features.filter(feature => {

        try{

            return turf.booleanIntersects(
                polygon,
                feature
            );

        }
        catch(err){

            return false;

        }

    }).length;

}

analyseBtn.onclick = () => {

    if(!siteGeo){

        alert(
            'Draw and finish a polygon first.'
        );

        return;

    }

    if(!waterData){

        alert(
            'Dataset not loaded.'
        );

        return;

    }

    const siteCount = countFeatures(0);
    const count10   = countFeatures(10);
    const count25   = countFeatures(25);
    const count50   = countFeatures(50);

    const withinSite = siteCount;
    const within10   = count10 - siteCount;
    const within25   = count25 - count10;
    const within50   = count50 - count25;

    const totalFeatures = count50;

    let risk = "NONE";
    let riskClass = "risk-none";

    if(siteCount > 0 || within10 > 0){

        risk = "HIGH";
        riskClass = "risk-high";

    }
    else if(within25 > 0){

        risk = "MEDIUM";
        riskClass = "risk-medium";

    }
    else if(within50 > 0){

        risk = "LOW";
        riskClass = "risk-low";

    }

    summary.innerHTML = `
        <h3 class="${riskClass}">
            OPEN WATER RISK: ${risk}
        </h3>

        <p>
        There are a total of
        <b>${totalFeatures}</b>
        Open Water Features within or
        in the vicinity of your site.
        </p>

        <p>
        <b>${withinSite}</b>
        open water features intersect
        the site boundary.
        </p>

        <p>
        <b>${within10}</b>
        additional open water features
        are present within 10m of the
        site boundary.
        </p>

        <p>
        <b>${within25}</b>
        additional open water features
        are present between 10m and 25m
        of the site boundary.
        </p>

        <p>
        <b>${within50}</b>
        additional open water features
        are present between 25m and 50m
        of the site boundary.
        </p>
    `;

};

clearBtn.onclick = () => {

    points = [];
    drawing = false;
    siteGeo = null;

    if(sitePolygon){

        map.removeLayer(sitePolygon);

        sitePolygon = null;

    }

    area.textContent = "0.000";

    summary.innerHTML =
        'Please draw a site polygon and click ' +
        '<b>Analyse Open Water</b>.';

};

</script>

</body>
</html>
