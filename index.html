<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LSBUD OpenWater 2.1 MVP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body{margin:0;font-family:Arial,sans-serif}#map{position:fixed;inset:0}#panel{position:absolute;right:15px;top:15px;width:420px;background:#fff;z-index:1000;padding:15px;border-radius:12px;max-height:92vh;overflow:auto;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.lsb,.d{color:#08243a;font-size:34px;font-weight:700}.u{color:#d92d27;font-size:34px;font-weight:700}.ow{color:#666;font-size:34px}
button,input,select{width:100%;padding:10px;margin:5px 0;box-sizing:border-box}
.btn-primary{background:#08243a;color:#fff;border:none}.btn-secondary{background:#6b7280;color:#fff;border:none}.btn-danger{background:#a92f38;color:#fff;border:none}
#status{font-weight:bold;color:#08243a;padding:8px 0}.metric{margin:8px 0}
</style>
</head>
<body>
<div id="panel">
<div><span class="lsb">LSB</span><span class="u">U</span><span class="d">D</span><span class="ow"> OpenWater</span></div>
<p><b>OPEN WATER RISK & PLANNING HUB</b></p>
<button id="drawBtn" class="btn-primary">Draw Polygon</button>
<button id="finishBtn" class="btn-secondary">Finish Drawing</button>
<button id="clearBtn" class="btn-danger">Clear</button>
<div id="status">Loading water dataset...</div>
<div class="metric">Area: <span id="area">0.000</span> km²</div>
<div class="metric">
<b>OPEN WATER RISK:</b>
<span id="risk">NONE</span>
</div>

<div id="summary"></div>
    
<button id="analyseBtn" class="btn-primary">Analyse Open Water</button>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>
const map=L.map('map').setView([52.48,-1.89],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
let waterData=null,sitePoly=null,drawing=false,pts=[];
async function loadWater(){try{const r=await fetch('./SurfaceWater_bham_clip.geojson');waterData=await r.json();waterLayer=L.geoJSON(waterData,{style:{opacity:0,fillOpacity:0}});status.textContent='Surface water dataset loaded';}catch(e){status.textContent='Failed to load SurfaceWater_bham_clip.geojson';console.error(e);}}
loadWater();
drawBtn.onclick=()=>{drawing=true;pts=[];status.textContent='Polygon mode active';if(sitePoly)map.removeLayer(sitePoly)};
map.on('click',e=>{if(!drawing)return;pts.push(e.latlng);if(sitePoly)map.removeLayer(sitePoly);sitePoly=L.polygon(pts,{color:'red'}).addTo(map);});
finishBtn.onclick=()=>{if(pts.length<3)return alert('Draw at least 3 points');drawing=false;const ring=pts.map(p=>[p.lng,p.lat]);ring.push(ring[0]);siteGeo=turf.polygon([ring]);area.textContent=(turf.area(siteGeo)/1000000).toFixed(3);status.textContent='Polygon completed';};
analyseBtn.onclick = () => {

    if (!siteGeo) {
        alert("Draw a site first");
        return;
    }

    function countFeatures(distance){

        const polygon =
            distance === 0
                ? siteGeo
                : turf.buffer(
                      siteGeo,
                      distance,
                      {units:"meters"}
                  );

        return waterData.features.filter(feature => {

            try{
                return turf.booleanIntersects(
                    polygon,
                    feature
                );
            }
            catch(err){
                return false;
            }

        }).length;

    }

    const siteCount = countFeatures(0);
    const count10   = countFeatures(10);
    const count25   = countFeatures(25);
    const count50   = countFeatures(50);

    const withinSite = siteCount;
    const within10   = count10 - siteCount;
    const within25   = count25 - count10;
    const within50   = count50 - count25;

    const totalFeatures = count50;

    let risk = "NONE";

    if(siteCount > 0)
        risk = "HIGH";
    else if(within10 > 0)
        risk = "HIGH";
    else if(within25 > 0)
        risk = "MEDIUM";
    else if(within50 > 0)
        risk = "LOW";

    document.getElementById(
        "totalFeatures"
    ).textContent = totalFeatures;

    document.getElementById(
        "withinSite"
    ).textContent = withinSite;

    document.getElementById(
        "within10"
    ).textContent = within10;

    document.getElementById(
        "within25"
    ).textContent = within25;

    document.getElementById(
        "within50"
    ).textContent = within50;

    document.getElementById(
        "risk"
    ).textContent = risk;

    document.getElementById(
        "summary"
    ).innerHTML = `
        <p>
        There are a total of
        <b>${totalFeatures}</b>
        Open Water Features within or
        in the vicinity of your site.
        </p>

        <p>
        <b>${withinSite}</b>
        open water features intersect
        the site boundary.
        </p>

        <p>
        <b>${within10}</b>
        additional open water features
        are present within 10m of the
        site boundary.
        </p>

        <p>
        <b>${within25}</b>
        additional open water features
        are present between 10m and
        25m of the site boundary.
        </p>

        <p>
        <b>${within50}</b>
        additional open water features
        are present between 25m and
        50m of the site boundary.
        </p>
    `;

    status.textContent =
        "Analysis complete";

};

clearBtn.onclick = () => {

    pts = [];
    drawing = false;
    siteGeo = null;

    if (sitePoly) {
        map.removeLayer(sitePoly);
    }

    area.textContent = "0.000";

    featureCount.textContent = "0";

    risk.textContent = "NONE";

    status.textContent = "Ready";

};

</script>
</body></html>
