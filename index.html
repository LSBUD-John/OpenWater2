<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>LSBUD Open Water Report - Phase 3</title><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'><style>body{margin:0;font-family:Arial}#map{position:fixed;inset:0}#panel{position:absolute;right:15px;top:15px;width:360px;background:#fff;padding:15px;border-radius:10px;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.25)}input,button{width:100%;padding:10px;margin:5px 0;box-sizing:border-box}button{background:#08243a;color:#fff;border:none}hr{margin:12px 0}</style></head><body><div id='panel'><h3>LSBUD Open Water Report</h3><input id='searchBox' placeholder='Search address or Easting Northing'><button id='findBtn'>Find</button><button id='drawPolygonBtn'>Draw Polygon</button><button id='finishBtn'>Finish Drawing</button><button id='clearBtn'>Clear</button><p>Area: <span id='selectedArea'>0.000</span> km²</p><hr><p>Features: <span id='waterCount'>0</span></p><p>Nearest Distance: <span id='nearestDistance'>-</span></p><p>Risk: <span id='riskResult'>Unknown</span></p><p>Indicative Price: £<span id='price'>0.00</span></p><button id='analyseBtn'>Analyse Open Water</button></div><div id='map'></div><script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script src='https://unpkg.com/@turf/turf@6/turf.min.js'></script><script src='https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js'></script><script>proj4.defs('EPSG:27700','+proj=tmerc +lat_0=49 +lon_0=-2 +k=0.9996012717 +x_0=400000 +y_0=-100000 +ellps=airy +datum=OSGB36 +units=m +no_defs');const map=L.map('map').setView([52.48,-1.89],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);let draw=false,pts=[],poly=null,geo=null,marker=null,waterLayer=null;function areaUpdate(){let a=turf.area(geo)/1e6;document.getElementById('selectedArea').textContent=a.toFixed(3);document.getElementById('price').textContent=Math.max(4.95,a*2).toFixed(2);}map.on('click',e=>{if(!draw)return;pts.push(e.latlng);if(poly)map.removeLayer(poly);poly=L.polygon(pts,{color:'red'}).addTo(map)});drawPolygonBtn.onclick=()=>{draw=true;pts=[];if(poly)map.removeLayer(poly)};finishBtn.onclick=()=>{if(pts.length<3)return;draw=false;let r=pts.map(p=>[p.lng,p.lat]);r.push(r[0]);geo=turf.polygon([r]);areaUpdate();};clearBtn.onclick=()=>{if(poly)map.removeLayer(poly);if(waterLayer)map.removeLayer(waterLayer);geo=null;pts=[];document.getElementById('waterCount').textContent='0';document.getElementById('nearestDistance').textContent='-';document.getElementById('riskResult').textContent='Unknown';};findBtn.onclick=()=>{let q=searchBox.value.trim();fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(q)).then(r=>r.json()).then(d=>{if(!d.length)return;let lat=+d[0].lat,lon=+d[0].lon;map.setView([lat,lon],15);if(marker)map.removeLayer(marker);marker=L.marker([lat,lon]).addTo(map);});};async function analyse(){if(!geo){alert('Draw a site first');return;}try{let c=turf.centroid(geo).geometry.coordinates;let query=`[out:json][timeout:15];(way(around:250,${c[1]},${c[0]})["natural"="water"];way(around:250,${c[1]},${c[0]})["waterway"];);out center;`;let r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(query));let txt=await r.text();if(!r.ok||txt.startsWith('<?xml')) throw new Error('Overpass unavailable');let data=JSON.parse(txt);document.getElementById('waterCount').textContent=data.elements.length;let d=data.elements.length?25:999;let risk=d<=25?'HIGH':d<=50?'MEDIUM':d<=100?'LOW':'NONE';document.getElementById('nearestDistance').textContent=data.elements.length?'~'+d+'m':'>100m';document.getElementById('riskResult').textContent=risk;}catch(e){document.getElementById('riskResult').textContent='SERVICE BUSY';console.log(e);}}analyseBtn.onclick=analyse;</script></body></html>
