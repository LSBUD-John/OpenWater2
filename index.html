<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>LSBUD OpenWater Phase 8.1</title><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'><style>body{margin:0;font-family:Arial}#map{position:fixed;inset:0}#panel{position:absolute;right:15px;top:15px;width:430px;background:#fff;padding:15px;border-radius:12px;z-index:1000;max-height:92vh;overflow:auto}.lsb,.d{color:#08243a;font-size:38px;font-weight:700}.u{color:#d92d27;font-size:38px;font-weight:700}.ow{color:#666;font-size:38px}button,input{width:100%;padding:10px;margin:5px 0}.btn-primary{background:#08243a;color:#fff;border:none}.btn-secondary{background:#6b7280;color:#fff;border:none}.btn-danger{background:#a92f38;color:#fff;border:none}#modeStatus{font-weight:700}.feature{border-top:1px solid #ddd;padding:5px 0}</style></head><body><div id='panel'><div><span class='lsb'>LSB</span><span class='u'>U</span><span class='d'>D</span><span class='ow'> OpenWater</span></div><div><b>OPEN WATER RISK & PLANNING HUB</b></div><p>Advanced water feature analysis that identifies nearby open water hazards and supports safer site planning.</p><input id='searchBox' placeholder='Search address'><button id='findBtn' class='btn-primary'>Find</button><button id='drawBtn' class='btn-primary'>Draw Polygon</button><button id='finishBtn' class='btn-secondary'>Finish Drawing</button><button id='clearBtn' class='btn-danger'>Clear</button><div id='modeStatus'>No drawing mode selected</div><p>Area: <span id='area'>0.000</span> km²</p><p>Price: £<span id='price'>0.00</span></p><p><b>Nearest Feature:</b> <span id='nearest'>-</span></p><p><b>Distance:</b> <span id='dist'>-</span></p><p><b>Risk:</b> <span id='risk'>Unknown</span></p><button id='analyseBtn' class='btn-primary'>Analyse Open Water</button><div id='features'></div></div><div id='map'></div><script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script src='https://unpkg.com/@turf/turf@6/turf.min.js'></script><script>const map=L.map('map').setView([52.48,-1.89],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);let drawing=false,pts=[],poly=null,siteGeo=null,water=L.featureGroup().addTo(map);drawBtn.onclick=()=>{drawing=true;pts=[];modeStatus.innerText='Polygon mode active - click points on map.'};map.on('click',e=>{if(!drawing)return;pts.push(e.latlng);if(poly)map.removeLayer(poly);poly=L.polygon(pts,{color:'red'}).addTo(map)});finishBtn.onclick=()=>{if(pts.length<3)return;drawing=false;modeStatus.innerText='Polygon completed.';const ring=pts.map(p=>[p.lng,p.lat]);ring.push(ring[0]);siteGeo=turf.polygon([ring]);const a=turf.area(siteGeo)/1e6;area.textContent=a.toFixed(3);price.textContent=Math.max(4.95,a*2).toFixed(2)};clearBtn.onclick=()=>{if(poly)map.removeLayer(poly);water.clearLayers();pts=[];siteGeo=null;area.textContent='0.000';price.textContent='0.00';nearest.textContent='-';dist.textContent='-';risk.textContent='Unknown';features.innerHTML='';modeStatus.innerText='No drawing mode selected';};async function queryOverpass(q){const eps=['https://overpass-api.de/api/interpreter','https://lz4.overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];for(const ep of eps){try{const r=await fetch(ep+'?data='+encodeURIComponent(q));if(!r.ok)continue;return JSON.parse(await r.text());}catch(e){}}throw new Error('All endpoints unavailable');}analyseBtn.onclick=async()=>{if(!siteGeo){alert('Draw site first');return;}features.innerHTML='Searching...';try{const b=turf.bbox(siteGeo);const q=`[out:json][timeout:15];(way(${b[1]-0.002},${b[0]-0.002},${b[3]+0.002},${b[2]+0.002})[waterway];way(${b[1]-0.002},${b[0]-0.002},${b[3]+0.002},${b[2]+0.002})[natural=water];);out tags center;`;const data=await queryOverpass(q);let c=turf.centroid(siteGeo).geometry.coordinates;let rows=(data.elements||[]).filter(e=>e.center).map(e=>({name:e.tags?.name||'Unnamed water feature',distance:Math.round(turf.distance(turf.point(c),turf.point([e.center.lon,e.center.lat]),{units:'kilometers'})*1000)})).sort((a,b)=>a.distance-b.distance);if(rows.length){nearest.textContent=rows[0].name;dist.textContent=rows[0].distance+'m';risk.textContent=rows[0].distance<=25?'HIGH':rows[0].distance<=50?'MEDIUM':rows[0].distance<=100?'LOW':'NONE';}features.innerHTML=rows.map(r=>`<div class='feature'><b>${r.name}</b><br>${r.distance}m</div>`).join('');}catch(e){features.innerHTML='All Overpass endpoints unavailable.';}};</script></body></html>
